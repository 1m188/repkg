name: Build & Deploy (Web)

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "web/**"
      - ".github/workflows/build-web.yml"

permissions:
  contents: read
  pages: write
  id-token: write

# 允许同一分支上的连续部署（取消排队中的旧实例）
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    name: Test (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci --no-fund --no-audit
      - name: Typecheck
        working-directory: web
        run: npx tsc --noEmit
      - name: Test
        working-directory: web
        run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci --no-fund --no-audit
      - name: Build
        working-directory: web
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    name: Deploy GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
